<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">OnyxMine</title><desc id="d">A block-inspired server world with animated geometric particles.</desc><defs><linearGradient id="bg"><stop stop-color="#1b2337"/><stop offset="1" stop-color="#080f1c"/></linearGradient><linearGradient id="ore"><stop stop-color="#7b8ca8"/><stop offset="1" stop-color="#293d5c"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#a89bff" stroke-width="2" fill="url(#ore)"><path d="M770 100L880 45L990 100L880 155Z"/><path d="M770 100V210L880 265V155Z"/><path d="M990 100V210L880 265V155Z"/></g><g fill="#62e3c1"><circle cx="690" cy="90" r="5"><animate attributeName="cy" values="90;65;90" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="1050" cy="165" r="6"><animate attributeName="cy" values="165;130;165" dur="3s" repeatCount="indefinite"/></circle><circle cx="740" cy="220" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g><text x="80" y="135" fill="#edf3ff" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="2">ONYXMINE</text><text x="84" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="4">PERSIAN MINECRAFT SERVER</text><path d="M85 215H520" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 435;435 0" dur="4s" repeatCount="indefinite"/></path></svg>